name: Python validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trilha_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d trilha_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TRILHA_TEST_DATABASE_URL: postgresql+psycopg://test:synthetic-ci-only@localhost:5432/trilha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Real PostgreSQL and portable tests
        run: python scripts/verify.py --postgres
      - uses: actions/upload-artifact@v4
        with:
          name: trilha-credito-evidence
          path: |
            evidence/
            artifacts/audit.json
            artifacts/junit.xml
