[project]
name = "trilha-credito"
version = "0.1.0"
description = "Synthetic credit-document intake, review and reconciliation laboratory"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: real PostgreSQL integration and concurrency"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
